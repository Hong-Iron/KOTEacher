<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코테가이드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 홈: 문제 목록 -->
<section class="view" id="home">
  <header class="top">
    <span class="brand">코테가이드</span>
    <span class="sp"></span>
    <span class="aistat" id="aiStat"><span class="dot"></span>코치 확인 중</span>
    <button class="btn" id="openBook">오답 노트 <span class="cnt coach" id="bookCnt">0</span></button>
  </header>
  <div class="home">
    <div class="home-inner">
      <div class="homebar">
        <h1>문제</h1>
        <span class="sp"></span>
        <div class="seg plain" id="lvSeg" role="group" aria-label="레벨">
          <button data-lv="0" aria-pressed="true">전체</button><button data-lv="1" aria-pressed="false">Lv1</button><button data-lv="2" aria-pressed="false">Lv2</button><button data-lv="3" aria-pressed="false">Lv3</button><button data-lv="4" aria-pressed="false">Lv4</button><button data-lv="5" aria-pressed="false">Lv5</button>
        </div>
        <input id="search" type="search" placeholder="문제나 개념 이름" aria-label="문제 찾기">
      </div>
      <div class="plist" id="plist"></div>
    </div>
  </div>
</section>

<!-- 풀기 -->
<section class="view" id="solve" hidden>
  <header class="top">
    <button class="btn" id="back" title="문제 목록">← 목록</button>
    <button class="btn" id="toggleProb" title="문제 칸 열고 닫기 (⌘B)">문제 칸</button>
    <div class="crumb"><b id="pTitle"></b><span class="tag" id="pLevel"></span><span class="tag" id="pSource"></span></div>
    <span class="sp"></span>
    <span class="meta" id="clock">0:00</span>
    <span class="meta" id="hintMeta">힌트 0 / 4</span>
    <div class="seg" id="modeSeg" role="group" aria-label="코치 말수">
      <button data-mode="quiet" aria-pressed="false" title="내가 실행하거나 물을 때만 말한다. 멈춰도 검사하지 않는다">조용히</button>
      <button data-mode="normal" aria-pressed="true" title="손을 멈추면 검사하고, 테스트로 확인된 문제만 먼저 말한다">보통</button>
      <button data-mode="active" aria-pressed="false" title="AI가 추정한 문제와 느릴 것 같은 방법도 먼저 짚는다">적극</button>
    </div>
    <button class="run" id="run">실행 ⌘↵</button>
  </header>
  <div class="main" id="main">
    <aside class="prob" aria-label="문제">
      <h2>문제</h2>
      <div class="st" id="pStatement"></div>
      <p class="note">개념: <span id="pConcepts"></span> · <a id="pUrl" href="#">원문 보기</a></p>
      <h2>입출력 예</h2>
      <table class="io" id="pExamples"></table>
      <h2>힌트 사다리</h2>
      <ol class="ladder" id="ladder"></ol>
      <div class="warn" id="warn" hidden><span></span><button id="warnYes">그래도 열기</button><button id="warnNo">조금 더 해 볼게요</button></div>
    </aside>
    <section class="work">
      <div class="edwrap" id="edwrap"><div id="editor"></div></div>
      <div class="dock" id="dock">
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="tests">테스트 <span class="cnt" id="testCnt">–</span></button>
          <button role="tab" aria-selected="false" data-tab="log">코치 기록 <span class="cnt coach" id="logCnt">0</span></button>
          <button role="tab" aria-selected="false" data-tab="mistakes">오답 기록 <span class="cnt" id="misCnt">0</span></button>
          <button role="tab" aria-selected="false" data-tab="out">출력</button>
          <div class="statusbar"><span id="edStat"></span><span class="aistat" id="aiStat2"><span class="dot"></span></span><button class="btn" id="dockToggle" style="padding:1px 8px">접기</button></div>
        </div>
        <div class="pbody" data-panel="tests" id="tests"><p class="note">실행(⌘↵)하면 예시와 숨은 검사를 돌린다.</p></div>
        <div class="pbody" data-panel="log" hidden><ul class="log" id="log"></ul></div>
        <div class="pbody" data-panel="mistakes" hidden id="misPanel"></div>
        <div class="pbody" data-panel="out" hidden><pre class="out" id="out">print 출력이 여기에 나온다.</pre></div>
      </div>
    </section>
  </div>
</section>

<!-- 오답 노트 -->
<section class="view" id="book" hidden>
  <header class="top">
    <button class="btn" id="bookBack">← 목록</button>
    <span class="brand">오답 노트</span>
    <span class="sp"></span>
    <div class="seg plain" id="catSeg" role="group" aria-label="분류"></div>
  </header>
  <div class="mbook"><div class="inner" id="bookList"></div></div>
</section>

<script src="vendor/monaco/vs/loader.js"></script>
<script src="app.js"></script>
</body>
</html>
