<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOTEacher</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="doc.css">
</head>
<body>

<!-- 홈: 문제 목록과 개념 목록 -->
<section class="view" id="home">
  <header class="top">
    <span class="brand"><img src="icon.svg" alt="" class="logo">KOTEacher</span>
    <span class="sp"></span>
    <button class="searchbar" data-search title="전체 검색 (⌘K)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>문제, 개념, 문서 내용 찾기</span><kbd>⌘K</kbd></button>
    <span class="sp"></span>
    <span class="aistat" id="aiStat"><span class="dot"></span>코치 확인 중</span>
    <button class="btn" id="openHist">풀이 기록</button>
    <button class="btn" id="openBook">오답 노트 <span class="cnt coach" id="bookCnt">0</span></button>
  </header>
  <div class="home">
    <div class="home-inner">
      <div class="homebar">
        <div class="seg plain big" id="homeSeg" role="tablist" aria-label="목록">
          <button data-list="problems" aria-pressed="true">문제 90</button><button data-list="concepts" aria-pressed="false">로드맵</button>
        </div>
        <span class="sp"></span>
        <div class="seg plain" id="lvSeg" role="group" aria-label="레벨">
          <button data-lv="0" aria-pressed="true">전체</button><button data-lv="1" aria-pressed="false">Lv1</button><button data-lv="2" aria-pressed="false">Lv2</button><button data-lv="3" aria-pressed="false">Lv3</button><button data-lv="4" aria-pressed="false">Lv4</button><button data-lv="5" aria-pressed="false">Lv5</button>
        </div>
        <input id="search" type="search" placeholder="문제나 개념 이름" aria-label="찾기">
      </div>
      <div class="plist" id="plist"></div>
      <article class="roadmap doc" id="clist" hidden></article>
    </div>
  </div>
</section>

<!-- 풀기: 왼쪽 문서 창(탭) | 오른쪽 코드 창 -->
<section class="view" id="solve" hidden>
  <header class="top">
    <button class="btn" id="back" title="목록">← 목록</button>
    <div class="crumb"><b id="pTitle"></b><span class="tag" id="pLevel"></span><span class="tag" id="pSource"></span></div>
    <span class="sp"></span>
    <button class="searchbar" data-search title="전체 검색 (⌘K)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>문제, 개념, 문서 내용 찾기</span><kbd>⌘K</kbd></button>
    <span class="sp"></span>
    <span class="meta" id="clock">0:00</span>
    <span class="meta" id="hintMeta">힌트 0 / 3</span>
    <div class="seg" id="modeSeg" role="group" aria-label="코치 말수">
      <button data-mode="quiet" aria-pressed="false" title="실행하거나 물을 때만 말합니다. 손을 멈춰도 검사하지 않습니다">조용히</button>
      <button data-mode="normal" aria-pressed="true" title="손을 멈추면 검사하고, 테스트로 확인된 문제만 먼저 말합니다">보통</button>
      <button data-mode="active" aria-pressed="false" title="AI가 추정한 문제와 느릴 것 같은 방법도 먼저 짚어 드립니다">적극</button>
    </div>
    <div class="seg plain" role="group" aria-label="창">
      <button id="foldLeft" aria-pressed="true" title="문서 창 열고 닫기 (⌘B)">문서</button><button id="foldRight" aria-pressed="true" title="코드 창 열고 닫기 (⌘⇧B)">코드</button>
    </div>
  </header>
  <div class="split" id="split">
    <section class="pane docpane" id="leftPane" aria-label="문서 창">
      <div class="dtabs" id="dtabs" role="tablist"></div>
      <div class="dbody" id="dbody">
        <div class="dpanel prob" data-tab="problem">
          <h2>문제</h2>
          <div class="st" id="pStatement"></div>
          <p class="note">원문: <a id="pUrl" href="#" target="_blank" rel="noopener">프로그래머스</a></p>
          <h2>개념</h2>
          <div class="chips" id="pConcepts"></div>
          <h2>입출력 예</h2>
          <table class="io" id="pExamples"></table>
          <h2>힌트 사다리</h2>
          <ol class="ladder" id="ladder"></ol>
          <div class="warn" id="warn" hidden><span></span><button id="warnYes">그래도 열기</button><button id="warnNo">조금 더 해 볼게요</button></div>
        </div>
      </div>
    </section>
    <button class="rail" id="railLeft" hidden title="문서 창 열기">문서</button>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="창 너비" tabindex="0"></div>
    <section class="pane work" id="rightPane" aria-label="코드 창">
      <div class="edwrap" id="edwrap"><div id="editor"></div></div>
      <div class="dock" id="dock">
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="tests">테스트 <span class="cnt" id="testCnt">–</span></button>
          <button role="tab" aria-selected="false" data-tab="log">코치 기록 <span class="cnt coach" id="logCnt">0</span></button>
          <button role="tab" aria-selected="false" data-tab="mistakes">오답 기록 <span class="cnt" id="misCnt">0</span></button>
          <button role="tab" aria-selected="false" data-tab="hist">풀이 기록</button>
          <button role="tab" aria-selected="false" data-tab="out">출력</button>
          <div class="statusbar"><span id="autoStat" class="autostat" hidden></span><span id="edStat"></span><span class="aistat" id="aiStat2"><span class="dot"></span></span><button class="btn" id="dockToggle" style="padding:1px 8px">접기</button><button class="run" id="run" title="예시와 숨은 검사 돌리기">실행 ⌘↵</button></div>
        </div>
        <div class="pbody" data-panel="tests" id="tests"><p class="note">실행(⌘↵)하면 예시와 숨은 검사를 돌립니다.</p></div>
        <div class="pbody" data-panel="log" hidden><ul class="log" id="log"></ul></div>
        <div class="pbody" data-panel="mistakes" hidden id="misPanel"></div>
        <div class="pbody" data-panel="hist" hidden id="histPanel"></div>
        <div class="pbody" data-panel="out" hidden><pre class="out" id="out">print 출력이 여기에 나옵니다.</pre></div>
      </div>
    </section>
    <button class="rail" id="railRight" hidden title="코드 창 열기">코드</button>
  </div>
</section>

<!-- 학습: 개념 문서 읽기 -->
<section class="view" id="learn" hidden>
  <header class="top">
    <button class="btn" id="learnBack">← 목록</button>
    <div class="crumb"><b id="lTitle"></b><span class="tag" id="lAlias"></span></div>
    <span class="sp"></span>
    <button class="searchbar" data-search title="전체 검색 (⌘K)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>문제, 개념, 문서 내용 찾기</span><kbd>⌘K</kbd></button>
    <span class="sp"></span>
  </header>
  <div class="learn">
    <article class="ldoc doc" id="lDoc"></article>
    <aside class="lside">
      <h2>이 개념으로 풀 문제</h2>
      <div id="lProblems"></div>
      <p class="note">문제를 열면 이 개념 문서가 왼쪽 문서 창에 탭으로 함께 열립니다.</p>
    </aside>
  </div>
</section>

<!-- 풀이 기록 -->
<section class="view" id="history" hidden>
  <header class="top">
    <button class="btn" id="histBack">← 목록</button>
    <span class="brand">풀이 기록</span>
    <span class="sp"></span>
    <button class="searchbar" data-search title="전체 검색 (⌘K)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>문제, 개념, 문서 내용 찾기</span><kbd>⌘K</kbd></button>
    <span class="sp"></span>
    <div class="seg plain" id="histSeg" role="group" aria-label="결과">
      <button data-f="" aria-pressed="true">전체</button><button data-f="solved" aria-pressed="false">통과</button><button data-f="helped" aria-pressed="false">힌트로 통과</button><button data-f="open" aria-pressed="false">미완</button>
    </div>
  </header>
  <div class="hist">
    <div class="hlist" id="hList"></div>
    <div class="hdetail" id="hDetail"><p class="note">왼쪽에서 기록을 고르면 그때의 코드와 실행 흐름이 나옵니다.</p></div>
  </div>
</section>

<!-- 오답 노트 -->
<section class="view" id="book" hidden>
  <header class="top">
    <button class="btn" id="bookBack">← 목록</button>
    <span class="brand">오답 노트</span>
    <span class="sp"></span>
    <button class="searchbar" data-search title="전체 검색 (⌘K)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>문제, 개념, 문서 내용 찾기</span><kbd>⌘K</kbd></button>
    <span class="sp"></span>
    <div class="seg plain" id="catSeg" role="group" aria-label="분류"></div>
  </header>
  <div class="mbook"><div class="inner" id="bookList"></div></div>
</section>

<!-- 처음 켤 때: 코치(AI) 준비 -->
<div class="palette" id="setup" hidden>
  <div class="pal setup" role="dialog" aria-label="코치 준비">
    <div class="sbody" id="setupBody"></div>
  </div>
</div>

<!-- 전체 검색 (⌘K) -->
<div class="palette" id="palette" hidden>
  <div class="pal" role="dialog" aria-label="전체 검색">
    <input id="palInput" type="search" placeholder="문제, 개념, 문서 내용, 내 질문, 오답 기록 찾기" aria-label="검색어" autocomplete="off">
    <div class="palres" id="palRes" role="listbox"></div>
    <div class="palfoot"><span>↑↓ 고르기</span><span>↵ 열기</span><span>esc 닫기</span><span class="sp"></span><span>풀이 단계는 검색하지 않습니다</span></div>
  </div>
</div>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/mermaid/mermaid.min.js"></script>
<script src="vendor/monaco/vs/loader.js"></script>
<script src="app.js"></script>
</body>
</html>
