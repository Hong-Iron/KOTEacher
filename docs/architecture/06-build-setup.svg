othic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">바로 e4b 받기 시작</text><path d="M640,330 L640,360" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="540" y="360" width="436" height="120" rx="10" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="1.4"/><text x="552" y="382" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">모델 다운로드 (api.pull_model)</text><text x="552" y="402" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">ghcr.io에서 받고, 끊기면 이어 받기로 3번까지 재시도</text><text x="552" y="419.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">그래도 실패하면 Ollama 레지스트리의 원본으로 폴백</text><text x="552" y="437.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">진행률 · 속도 · 남은 시간 · 출처 표시</text><text x="552" y="454.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">팝업을 닫아도 계속 받고, 상단 바에 % 표시</text></svg>
