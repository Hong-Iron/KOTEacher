mily="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">v* 태그 push</text><rect x="270" y="156" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="380.0" y="178" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">build_win.py: PyInstaller</text><path d="M380,144 L380,156" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="270" y="208" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="380.0" y="230" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">Inno Setup → Setup.exe</text><path d="M380,196 L380,208" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="270" y="260" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="380.0" y="282" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">zip도 함께</text><path d="M380,248 L380,260" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="270" y="312" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="380.0" y="334" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">릴리스에 업로드</text><path d="M380,300 L380,312" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="436" width="466" height="96" rx="10" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="1.4"/><text x="36" y="458" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" t