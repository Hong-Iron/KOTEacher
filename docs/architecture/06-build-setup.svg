<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A92A3"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C56C9"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D99A1E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B93A27"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4A"/></marker></defs><rect width="1000" height="640" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#1B2130" text-anchor="start">앱을 만드는 과정과 처음 켤 때 코치를 준비하는 과정</text><text x="24" y="90" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">맥 (tools/build_mac.py)</text><rect x="24" y="104" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="134.0" y="126" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">팩 90개 미리 만들기</text><rect x="24" y="156" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="134.0" y="178" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">PyInstaller로 .app 묶기</text><path d="M134,144 L134,156" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="208" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="134.0" y="230" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">임시 서명 (codesign -s -)</text><path d="M134,196 L134,208" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="260" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="134.0" y="282" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">묶인 앱으로 자가 점검</text><path d="M134,248 L134,260" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="312" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="134.0" y="334" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">DMG 만들기</text><path d="M134,300 L134,312" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="90" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">윈도 (GitHub Actions)</text><rect x="270" y="104" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="380.0" y="126" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">태그 v* 를 올림</text><rect x="270" y="156" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="380.0" y="178" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">build_win.py: PyInstaller</text><path d="M380,144 L380,156" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="270" y="208" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="380.0" y="230" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">Inno Setup → Setup.exe</text><path d="M380,196 L380,208" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="270" y="260" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="380.0" y="282" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">zip도 함께</text><path d="M380,248 L380,260" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="270" y="312" width="220" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="380.0" y="334" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">릴리스에 붙임</text><path d="M380,300 L380,312" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="384" width="466" height="96" rx="10" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="1.4"/><text x="36" y="406" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">한 줄 설치 (install.sh · install.ps1)</text><text x="36" y="426" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">저장소를 받아 파이썬 가상 환경을 만들고, Ollama와 코치 모델까지</text><text x="36" y="443.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">설치한다. 인텔 맥과 리눅스는 이 길을 쓴다. curl로 받은 파일에는</text><text x="36" y="461.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">&#x27;인터넷에서 받음&#x27; 표시가 붙지 않아 맥 경고가 뜨지 않는다.</text><text x="540" y="90" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">처음 켤 때 (api.prepare_coach)</text><rect x="540" y="104" width="200" height="40" rx="10" fill="#E8EEFC" stroke="#2C56C9" stroke-width="1.4"/><text x="640.0" y="126" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">앱 켬, 코치 모델 있나?</text><path d="M740,124 L790,124" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="765" y="116" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="middle">있음</text><rect x="790" y="104" width="186" height="40" rx="10" fill="#E6F4EA" stroke="#2E7D4A" stroke-width="1.4"/><text x="883.0" y="126" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">그대로 씀</text><path d="M640,144 L640,180" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="665" y="166" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="middle">없음</text><rect x="540" y="180" width="200" height="40" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="640.0" y="202" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">Ollama가 켜져 있나?</text><path d="M740,200 L790,200" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="765" y="192" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="middle">꺼짐</text><rect x="790" y="180" width="186" height="76" rx="10" fill="#FDF3E1" stroke="#D99A1E" stroke-width="1.4"/><text x="802" y="202" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">설치돼 있으면 켠다</text><text x="802" y="219.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">없으면: 맥은 버튼 하나로</text><text x="802" y="237.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">설치, 윈도는 안내</text><path d="M640,220 L640,270" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="665" y="252" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="middle">켜짐</text><path d="M883,256 L883,290 L740,290" fill="none" stroke="#D99A1E" stroke-width="1.6" marker-end="url(#c)"/><rect x="540" y="270" width="200" height="60" rx="10" fill="#E8EEFC" stroke="#2C56C9" stroke-width="1.4"/><text x="640.0" y="292" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">팝업을 띄우고</text><text x="640.0" y="310" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">바로 e4b 받기 시작</text><path d="M640,330 L640,360" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="540" y="360" width="436" height="120" rx="10" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="1.4"/><text x="552" y="382" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">받기 규칙 (api.pull_model)</text><text x="552" y="402" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">GitHub 패키지(ghcr.io)에서 받는다. 끊기면 받던 데서 이어</text><text x="552" y="419.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">3번까지 다시 받고, 그래도 안 되면 Ollama 서버에서 원래 판을 받는다.</text><text x="552" y="437.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">받는 동안 받은 양·초당 MB·남은 시간·받는 곳을 보인다.</text><text x="552" y="454.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">팝업을 닫아도 받기는 계속되고 위 막대에 몇 %인지 보인다.</text></svg>
