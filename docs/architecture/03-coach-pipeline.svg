<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" width="1000" height="545"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A92A3"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C56C9"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D99A1E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B93A27"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4A"/></marker></defs><rect width="1000" height="545" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#1B2130" text-anchor="start">코치 파이프라인</text><text x="24" y="56" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#5B6476" text-anchor="start">결정적인 방법부터 쓴다: 규칙 → 변이 탐색 → LLM. LLM 단계는 모델별 프로필을 쓴다</text><rect x="24" y="90" width="160" height="120" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="36" y="112" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">실패 정리</text><text x="36" y="132" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">오류 &gt; 오답 &gt; 시간 초과</text><text x="36" y="149.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">같으면 입력이 짧은</text><text x="36" y="167.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">반례가 먼저</text><path d="M184,150 L214,150" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="214" y="80" width="250" height="140" rx="10" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="1.4"/><text x="226" y="102" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">진단 (diagnose)</text><rect x="224" y="108" width="230" height="30" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="234" y="128" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="700" fill="#1B2130" text-anchor="start">규칙</text><text x="300" y="128" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="10.5" font-weight="400" fill="#5B6476" text-anchor="start">문법·불러오기 오류 → 그 줄</text><rect x="224" y="144" width="230" height="30" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="234" y="164" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="700" fill="#1B2130" text-anchor="start">변이 탐색</text><text x="300" y="164" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="10.5" font-weight="400" fill="#5B6476" text-anchor="start">한 곳 바꿔 모두 통과 → 그 줄</text><rect x="224" y="180" width="230" height="30" rx="10" fill="#FDF3E1" stroke="#D99A1E" stroke-width="1.4"/><text x="234" y="200" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="700" fill="#1B2130" text-anchor="start">LLM 진단</text><text x="300" y="200" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="10.5" font-weight="400" fill="#5B6476" text-anchor="start">실행 추적을 읽고 줄·말·분류</text><path d="M464,150 L494,150" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="494" y="80" width="190" height="140" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="506" y="102" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">정책 (Policy)</text><text x="506" y="122" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">문법 오류: 칩만</text><text x="506" y="139.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">조용히 모드: 칩만</text><text x="506" y="157.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">같은 말은 다시 안 함</text><text x="506" y="174.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">자동 검사: 180초에 한 번</text><text x="506" y="192.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">(normal 모드: 확정 진단만)</text><path d="M684,100 L720,100" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="702" y="92" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="middle">chip</text><path d="M684,180 L720,180" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="702" y="172" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="middle">speak</text><rect x=