><text x="652" y="360.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">⑤ 320자 넘음</text><path d="M640,340 L500,340" fill="none" stroke="#2E7D4A" stroke-width="1.6" marker-end="url(#g)"/><text x="570" y="332.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#2E7D4A" text-anchor="middle">통과</text><rect x="330" y="312" width="170" height="56" rx="10" fill="#E8EEFC" stroke="#2C56C9" stroke-width="1.4"/><text x="415.0" y="334" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">말풍선에 질문 표시</text><text x="415.0" y="351.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">(coach_msgs에 저장)</text><path d="M810,398 L810,430" fill="none" stroke="#B93A27" stroke-width="1.6" marker-end="url(#r)"/><text x="838" y="420.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#B93A27" text-anchor="middle">걸림</text><rect x="700" y="430" width="250" height="68" rx="10" fill="#FBE6E2" stroke="#B93A27" stroke-width="1.4"/><text x="825.0" y="452" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">확정 진단: 위반 사유를 붙여</text><text x="825.0" y="469.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">한 번 재생성</text><text x="825.0" y="487.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">LLM 진단: 바로 폴백</text><path d="M700,464 L500,464" fill="none" stroke="#B93A27" stroke-width="1.6" marker-end="url(#r)"/><text x="600" y="456.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#B93A27" text-anchor="middle">폴백</text><rect x="330" y="436" width="170" height="56" rx="10" fill="#E8EEFC" stroke="#2C56C9" stroke-width="1.4"/><text x="415.0" y="458" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">폴백 템플릿</text><text x="415.0" y="475.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">(줄과 반례만 언급)</text><rect x="24" y="260" width="280" height="180" rx="10" fill="#E6F4EA" stroke="#2E7D4A" stroke-width="1.4"/><text x="36" y="282" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">프로필 선택 (profile)</text><text x="36" y="302" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">모델 이름으로 고른다</text><text x="36" y="319.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">gemma → 기본</text><text x="36" y="337.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">mistral → Ministral용</text><text x="36" y="354.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">qwen·omnicoder → Qwen용</text><text x="36" y="372.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">시스템 프롬프트 · temperature</text><text x="36" y="389.5" font-family="'