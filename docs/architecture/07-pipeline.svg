<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A92A3"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C56C9"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D99A1E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B93A27"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4A"/></marker></defs><rect width="1000" height="750" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#1B2130" text-anchor="start">채점·코치 파이프라인과 단계 사이의 데이터</text><text x="24" y="56" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#5B6476" text-anchor="start">가운데가 실행 한 번의 단계, 화살표 위의 글자가 단계 사이를 오가는 데이터다</text><rect x="250" y="80" width="400" height="44" rx="10" fill="#E8EEFC" stroke="#2C56C9" stroke-width="1.4"/><text x="450.0" y="102" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#5B6476" text-anchor="middle">에디터에서 코드 입력</text><rect x="700" y="72" width="276" height="60" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="712" y="94" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">pyflakes 정적 분석</text><text x="712" y="114" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">타이핑할 때마다, 실행 없이 밑줄</text><path d="M650,102 L700,102" fill="none" stroke="#8A92A3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="675" y="94" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="middle">코드</text><path d="M450,124 L450,160" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="460" y="146" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="start">실행 ⌘↵, 자동 검사를 켰으면 입력 멈춘 지 2.7초</text><rect x="250" y="160" width="400" height="44" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="450.0" y="182" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#5B6476" text-anchor="middle">Api.check(code, trigger)  ·  gen += 1</text><path d="M450,204 L450,244" fill="none" stroke="#D99A1E" stroke-width="1.6" marker-end="url(#c)"/><text x="460" y="228" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="start">stdin  {code, pack, repair}</text><rect x="250" y="244" width="400" height="150" rx="10" fill="#FDF3E1" stroke="#D99A1E" stroke-width="1.4"/><text x="262" y="266" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">harness (서브프로세스)</text><text x="262" y="286" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">① 문법 검사 → ② solution 로드</text><text x="262" y="303.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">③ 예시 실행 (테스트당 2초)</text><text x="262" y="321.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">④ 히든 테스트: 작은 입력부터, 첫 실패에서 중단</text><text x="262" y="338.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">⑤ 최소 반례로 실행 추적</text><text x="262" y="356.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">⑥ 변이 탐색: 한 곳씩 바꿔 모두 통과하는지</text><rect x="700" y="270" width="276" height="84" rx="10" fill="#E6F4EA" stroke="#2E7D4A" stroke-width="1.4"/><text x="712" y="292" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">팩 pg42748.json</text><text x="712" y="312" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">예시 2개 (문제의 입출력 예)</text><text x="712" y="329.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">히든 테스트 340개</text><path d="M700,312 L654,312" fill="none" stroke="#2E7D4A" stroke-width="1.6" marker-end="url(#g)"/><text x="677" y="304" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="middle">읽기</text><path d="M450,394 L450,434" fill="none" stroke="#D99A1E" stroke-width="1.6" marker-end="url(#c)"/><text x="460" y="418" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="start">stdout  {examples, hidden, trace, repair}</text><rect x="250" y="434" width="400" height="44" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="450.0" y="456" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">facts: 실패를 모아 예외 &gt; 오답 &gt; 시간 초과 순으로 정렬</text><rect x="700" y="434" width="276" height="44" rx="10" fill="#E8EEFC" stroke="#2C56C9" stroke-width="1.4"/><text x="838.0" y="456" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">테스트 표 · 반례 (즉시 반환)</text><path d="M650,456 L700,456" fill="none" stroke="#2C56C9" stroke-width="1.6" marker-end="url(#b)"/><path d="M450,478 L450,508" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="460" y="497" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="start">백그라운드 스레드</text><rect x="250" y="508" width="400" height="44" rx="10" fill="#FDF3E1" stroke="#D99A1E" stroke-width="1.4"/><text x="450.0" y="530" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#5B6476" text-anchor="middle">진단: 규칙 → 변이 탐색 → LLM</text><path d="M450,552 L450,582" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="460" y="571" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="start">diag  {tier, line, category, confidence}</text><rect x="250" y="582" width="400" height="44" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="450.0" y="604" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#5B6476" text-anchor="middle">발화 정책: speak · chip · none</text><path d="M450,626 L450,656" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="460" y="645" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="start">speak</text><rect x="250" y="656" width="400" height="44" rx="10" fill="#FDF3E1" stroke="#D99A1E" stroke-width="1.4"/><text x="450.0" y="678" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#5B6476" text-anchor="middle">응답 생성 → 유출 검사 → 걸리면 폴백 템플릿</text><rect x="700" y="656" width="276" height="44" rx="10" fill="#E8EEFC" stroke="#2C56C9" stroke-width="1.4"/><text x="838.0" y="678" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#5B6476" text-anchor="middle">말풍선</text><path d="M650,678 L700,678" fill="none" stroke="#2C56C9" stroke-width="1.6" marker-end="url(#b)"/><text x="675" y="670" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="400" fill="#5B6476" text-anchor="middle">이벤트</text><text x="24" y="734" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="start">이벤트 순서: thinking → line → stream × n → diag → say (또는 chip)</text></svg>
