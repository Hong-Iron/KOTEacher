<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A92A3"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C56C9"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D99A1E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B93A27"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4A"/></marker></defs><rect width="980" height="470" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#1B2130" text-anchor="start">문제 상태 판정</text><text x="24" y="56" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#5B6476" text-anchor="start">문제 상태는 그 문제의 모든 시도 중 가장 좋은 결과다 (통과 &gt; 힌트로 통과 &gt; 시도)</text><rect x="24" y="120" width="130" height="60" rx="10" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="1.4"/><text x="89.0" y="142" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="middle">새 문제</text><text x="89.0" y="162" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">아직 실행 안 함</text><path d="M154,150 L214,150" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="184" y="142.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">실행</text><rect x="214" y="120" width="130" height="60" rx="10" fill="#FBE6E2" stroke="#B93A27" stroke-width="1.4"/><text x="279.0" y="142" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="middle">시도</text><text x="279.0" y="162" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">검사를 못 넘김</text><path d="M344,150 L404,150" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><text x="374" y="142.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="middle">모두 통과</text><rect x="404" y="90" width="270" height="130" rx="10" fill="#F1F3F7" stroke="#8A92A3" stroke-width="1.4"/><text x="416" y="112" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">이 시도에서 받은 도움은?</text><text x="416" y="132" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">힌트 2개 이상, 또는 풀이 봄</text><text x="416" y="149.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">→ 힌트로 통과</text><text x="416" y="167.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">실전 모드, 반례·코치·힌트 없이 제출</text><text x="416" y="184.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">→ 실전 통과</text><text x="416" y="202.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">그 밖 → 통과</text><path d="M674,130 L734,130" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="734" y="112" width="150" height="34" rx="10" fill="#FDF3E1" stroke="#D99A1E" stroke-width="1.4"/><text x="809.0" y="134" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">힌트로 통과</text><path d="M674,170 L734,170" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="734" y="152" width="150" height="34" rx="10" fill="#E8EEFC" stroke="#2C56C9" stroke-width="1.4"/><text x="809.0" y="174" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">실전 통과</text><path d="M674,210 L734,210" fill="none" stroke="#8A92A3" stroke-width="1.6" marker-end="url(#a)"/><rect x="734" y="192" width="150" height="34" rx="10" fill="#E6F4EA" stroke="#2E7D4A" stroke-width="1.4"/><text x="809.0" y="214" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#5B6476" text-anchor="middle">통과</text><rect x="24" y="270" width="440" height="160" rx="10" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="1.4"/><text x="36" y="292" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">이어 쓰면 도움도 이어 받는다</text><text x="36" y="312" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">문제를 다시 열 때 지난 코드를 불러오면, 그 코드를 쓴</text><text x="36" y="329.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">시도의 힌트 수와 &#x27;풀이 봄&#x27;을 새 시도에 함께 기록한다.</text><text x="36" y="347.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">&#x27;이 코드로 다시 열기&#x27;, &#x27;이 코드 불러오기&#x27;, &#x27;처음부터&#x27;도 같다.</text><text x="36" y="364.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start"></text><text x="36" y="382.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">홈의 &#x27;다시 풀기&#x27;만 빈 기록으로 연다.</text><text x="36" y="399.5" font-family="Menlo,Consolas,'D2Coding',monospace" font-size="11.5" font-weight="400" fill="#1B2130" text-anchor="start">(api.py: Session.carried_hints, _carry)</text><rect x="500" y="270" width="456" height="160" rx="10" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="1.4"/><text x="512" y="292" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1B2130" text-anchor="start">왜 이렇게 하나</text><text x="512" y="312" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">힌트로 푼 코드를 다시 열어 실행하면 그대로 통과한다.</text><text x="512" y="329.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">도움을 이어 받지 않으면 힌트 0개인 새 시도가 통과해</text><text x="512" y="347.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">문제 상태가 &#x27;통과&#x27;로 바뀐다. 힌트를 이미 봤으므로</text><text x="512" y="364.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">&#x27;힌트로 통과&#x27;로 남는 쪽이 맞다.</text><text x="512" y="382.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start"></text><text x="512" y="399.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#5B6476" text-anchor="start">1개까지는 &#x27;통과&#x27;로 친다 (store.problem_status).</text></svg>
